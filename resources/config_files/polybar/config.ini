[colors]
# Color de fondo.
background = #004172
# Color focus workspace
background-alt = #3B70A3


# Color txt focus
foreground = #80BAF3
label-ocupied = #80BAF3
# Color workspace vacio.
foreground-alt = #2C6AA6

primary = #000000
secondary = #e60053
alert = #bd2c40





[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 22
enable-ipc = true
background = ${colors.background}
foreground = ${colors.foreground}
#fixed-center = true

#----------Espaciado entre modulos----------
module-margin-left = 1
module-margin-right = 1
padding-right = 1
padding-left = 1

separator = "|"
separator-foreground = ${colors.foreground-alt}


#----------Modules----------
modules-left = vpn python arch linux linux_sep ram gpu cpu
modules-center = bspwm
modules-right = target net battery pulseaudio date

#----------Son los cursores que podemos elegir----------
cursor-click = pointer
cursor-scroll = ns-resize

#----------Font----------
font-0 = "Hack Nerd Font:style=Bold:size=13;1"
#font-1 = "Symbols Nerd Font Mono:size=12"


[module/python]
type="custom/text"
content = " "

[module/arch]
type="custom/text"
content = " "

[module/linux]
type="custom/text"
content = " "
click-left = {{DOTFILES_REPO}}/scripts/toggle-cpu-module.sh

[module/linux_sep]
type="custom/text"
content = ""
hidden = false




[module/bspwm]
type = internal/bspwm
label-monitor = %name%

#label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-padding = 1

#label-occupied = %name%
label-occupied-foreground = ${colors.label-ocupied}
label-occupied-padding = 1

#label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

#label-empty = %name%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1





[module/date]
type = internal/date
interval = 1

time = %H:%M:%S
time-alt = %d/%m/%Y %H:%M:%S

format-prefix-foreground = ${colors.foreground-alt}
label = %time%





[module/pulseaudio]
type = internal/pulseaudio
#mute="🔇"
#vol_1="🔈"
#vol_2="🔉"
#vol_3="🔊"
format-volume = <label-volume>
format-muted = <label-muted>

label-volume = Vol:%percentage%
label-volume-foreground = ${colors.foreground}

label-muted = ~Mute~
label-muted-foreground = #999

bar-volume-width = 0


[module/net]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/network-status.sh
interval = 3
click-left = {{DOTFILES_REPO}}/scripts/wifi-menu.sh

[module/cpu]
type = internal/cpu
interval = 1
hidden = true
format = <label>  <ramp-coreload>
label = CPU %percentage:2%%
ramp-coreload-spacing = 0
ramp-coreload-0 = ▁
ramp-coreload-0-foreground = ${colors.foreground-alt}
ramp-coreload-1 = ▂
ramp-coreload-1-foreground = ${colors.foreground-alt}
ramp-coreload-2 = ▃
ramp-coreload-2-foreground = ${colors.foreground}
ramp-coreload-3 = ▄
ramp-coreload-3-foreground = ${colors.foreground}
ramp-coreload-4 = ▅
ramp-coreload-4-foreground = ${colors.foreground}
ramp-coreload-5 = ▆
ramp-coreload-5-foreground = ${colors.label-ocupied}
ramp-coreload-6 = ▇
ramp-coreload-6-foreground = ${colors.alert}
ramp-coreload-7 = █
ramp-coreload-7-foreground = ${colors.alert}

[module/ram]
type = internal/memory
interval = 2
hidden = true
format = <label>
label = RAM %percentage_used:2%%

[module/gpu]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/gpu-status.sh
interval = 2
hidden = true

[module/battery]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/battery-status.sh
interval = 10


#----------Kit de engagement----------
# Mismos scripts que usa eww: los dos módulos existen en las DOS barras para que el kit
# viaje igual a cualquier máquina (la VM de ataque suele quedarse en polybar, porque eww
# hay que compilarlo con Rust y no está en repos Debian).
#
# Acá los scripts se llaman con `--polybar` porque polybar no puede decidir el color según
# el valor: necesita el string ya con sus etiquetas `%{F#...}`. En eww eso se resuelve con
# una clase CSS, que es donde va.

[module/vpn]
# Tu IP de VPN: la que ven los targets. Vacío (módulo invisible) si no hay VPN levantada,
# así el mismo config sirve en la máquina de todos los días.
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/vpn-status.sh --polybar
interval = 5
click-left = {{DOTFILES_REPO}}/scripts/vpn-status.sh | xclip -selection clipboard

[module/target]
# La máquina objetivo. Apagada = mira sola; con target = rojo con la IP.
# Se setea con `dot target set <ip>`.
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/target-status.sh --polybar
interval = 2
click-left = dot target copy
