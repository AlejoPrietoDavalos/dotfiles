[colors]
# Color de fondo.
background = #004172
# Color focus workspace
background-alt = #3B70A3


# Color txt focus
foreground = #80BAF3
label-ocupied = #80BAF3
# Color workspace vacio.
foreground-alt = #2C6AA6

primary = #000000
secondary = #e60053
alert = #bd2c40





[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 22
enable-ipc = true
background = ${colors.background}
foreground = ${colors.foreground}
#fixed-center = true

#----------Espaciado entre modulos----------
module-margin-left = 1
module-margin-right = 1
padding-right = 1
padding-left = 1

separator = "|"
separator-foreground = ${colors.foreground-alt}


#----------Modules----------
modules-left = python arch linux linux_sep ram gpu cpu
modules-center = bspwm
modules-right = net battery pulseaudio date

#----------Son los cursores que podemos elegir----------
cursor-click = pointer
cursor-scroll = ns-resize

#----------Font----------
font-0 = "Hack Nerd Font:style=Bold:size=13;1"
#font-1 = "Symbols Nerd Font Mono:size=12"


[module/python]
type="custom/text"
content = " "

[module/arch]
type="custom/text"
content = " "

[module/linux]
type="custom/text"
content = " "
click-left = {{DOTFILES_REPO}}/scripts/toggle-cpu-module.sh

[module/linux_sep]
type="custom/text"
content = ""
hidden = false




[module/bspwm]
type = internal/bspwm
label-monitor = %name%

# Los desktops del pad numérico se llaman n1-n4 en bspwm; acá se muestran como
# / * - + (ver module/bspwm-single para el caso de 1 solo monitor).
ws-icon-0 = "n1;/"
ws-icon-1 = "n2;*"
ws-icon-2 = "n3;-"
ws-icon-3 = "n4;+"
ws-icon-4 = 1;1
ws-icon-5 = 2;2
ws-icon-6 = 3;3
ws-icon-7 = 4;4
ws-icon-8 = 5;5
ws-icon-9 = 6;6
ws-icon-10 = 7;7
ws-icon-11 = 8;8
ws-icon-12 = 9;9
ws-icon-13 = 0;0
ws-icon-default = ?

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.label-ocupied}
label-occupied-padding = 1

label-urgent = %icon%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1

# Con 1 solo monitor el "+" del pad queda pegado al "1" numérico: este módulo
# agrega un espacio al ícono del "+" como separador. launch.sh elige bar/single.
[module/bspwm-single]
inherit = module/bspwm
ws-icon-3 = "n4;+  "

[bar/single]
inherit = bar/example
modules-center = bspwm-single





[module/date]
type = internal/date
interval = 1

time = %H:%M:%S
time-alt = %d/%m/%Y %H:%M:%S

format-prefix-foreground = ${colors.foreground-alt}
label = %time%





[module/pulseaudio]
type = internal/pulseaudio
#mute="🔇"
#vol_1="🔈"
#vol_2="🔉"
#vol_3="🔊"
format-volume = <label-volume>
format-muted = <label-muted>

label-volume = Vol:%percentage%
label-volume-foreground = ${colors.foreground}

label-muted = ~Mute~
label-muted-foreground = #999

bar-volume-width = 0


[module/net]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/network-status.sh
interval = 3
click-left = {{DOTFILES_REPO}}/scripts/wifi-menu.sh

[module/cpu]
type = internal/cpu
interval = 1
hidden = true
format = <label>  <ramp-coreload>
label = CPU %percentage:2%%
ramp-coreload-spacing = 0
ramp-coreload-0 = ▁
ramp-coreload-0-foreground = ${colors.foreground-alt}
ramp-coreload-1 = ▂
ramp-coreload-1-foreground = ${colors.foreground-alt}
ramp-coreload-2 = ▃
ramp-coreload-2-foreground = ${colors.foreground}
ramp-coreload-3 = ▄
ramp-coreload-3-foreground = ${colors.foreground}
ramp-coreload-4 = ▅
ramp-coreload-4-foreground = ${colors.foreground}
ramp-coreload-5 = ▆
ramp-coreload-5-foreground = ${colors.label-ocupied}
ramp-coreload-6 = ▇
ramp-coreload-6-foreground = ${colors.alert}
ramp-coreload-7 = █
ramp-coreload-7-foreground = ${colors.alert}

[module/ram]
type = internal/memory
interval = 2
hidden = true
format = <label>
label = RAM %percentage_used:2%%

[module/gpu]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/gpu-status.sh
interval = 2
hidden = true

[module/battery]
type = custom/script
exec = {{DOTFILES_REPO}}/scripts/battery-status.sh
interval = 10
